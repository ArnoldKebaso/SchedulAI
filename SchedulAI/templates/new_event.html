{% extends 'base.html' %}
{% block title %}Schedule New Event{% endblock %}
{% block content %}
<div class="max-w-xl mx-auto p-4">
  <h1 class="text-2xl font-bold mb-4">Schedule New Event</h1>
  <form method="POST" action="{{ url_for('new_event') }}" class="space-y-4">
    <textarea name="event_text" rows="4" required
      class="w-full p-2 border rounded"
      placeholder="E.g., Schedule an interview with Alice next Monday at 10am for 45 minutes."></textarea>
    <button type="submit"
      class="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700">
      Submit
    </button>
  </form>
</div>
{% endblock %}
