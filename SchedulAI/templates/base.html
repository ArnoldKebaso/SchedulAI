<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}SchedulAI{% endblock %}</title>
  <link href="{{ url_for('static', filename='css/output.css') }}" rel="stylesheet">
</head>
<body class="bg-gray-100 text-gray-800">
  <nav class="bg-white shadow p-4 mb-6">
    <div class="container mx-auto flex justify-between">
      <a href="{{ url_for('index') }}" class="text-xl font-bold">SchedulAI</a>
      <div class="space-x-4">
        <a href="{{ url_for('index') }}">Dashboard</a>
        <a href="{{ url_for('calendar') }}">Calendar</a>
        <a href="{{ url_for('new_event') }}">New Event</a>
        <a href="{{ url_for('followups') }}">Follow-ups</a>
      </div>
    </div>
  </nav>

  <main class="container mx-auto">
    {% with messages = get_flashed_messages() %}
      {% if messages %}
        <div class="mb-4">
          {% for msg in messages %}
            <div class="bg-green-100 text-green-800 p-2 rounded mb-2">{{ msg }}</div>
          {% endfor %}
        </div>
      {% endif %}
    {% endwith %}

    {% block content %}{% endblock %}
  </main>
</body>
</html>
