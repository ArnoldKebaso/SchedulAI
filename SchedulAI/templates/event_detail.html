{% extends 'base.html' %}
{% block title %}Event Details{% endblock %}
{% block content %}
<div class="max-w-2xl mx-auto p-4 space-y-4">
  <h1 class="text-2xl font-bold">Event Details</h1>

  <div class="border p-4 rounded">
    <h2 class="text-xl font-semibold">{{ event.summary }}</h2>
    <p class="text-gray-600">Start: {{ event.start }}</p>
    <p class="text-gray-600">End: {{ event.end }}</p>
  </div>

  <div class="border p-4 rounded bg-gray-50">
    <h3 class="text-lg font-semibold mb-2">AI‑Generated Preparation Notes</h3>
    <p class="whitespace-pre-wrap">{{ prep_notes }}</p>
  </div>

  <a href="{{ url_for('index') }}"
     class="inline-block mt-4 bg-blue-500 text-white px-4 py-2 rounded hover:bg-blue-600">
    ← Back to Dashboard
  </a>
</div>
{% endblock %}
